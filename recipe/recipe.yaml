context:
  name: rprank
  version: 6.8.2

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/brsynth/rpRank/archive/refs/tags/${{ version }}.tar.gz
  sha256: 820625bbd5237a827829c8212ea62d9e9f36b34e09044cc9d0064372a12be5de

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - brs_utils >=1.26.0
    - rplibs >=6.9.5

tests:
  - python:
      imports:
        - rprank
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"
  - script:
      - python -m rprank --help

about:
  homepage: https://github.com/brsynth/rpRank/tree/main
  summary: "Rank a list of pathways according to their global score"
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ramez17khaled
    - breakthewall
    - tduigou
